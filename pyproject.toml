[project]
name = "production-rag"
version = "0.1.0"
description = "Production-style RAG starter: hybrid search, reranking, Qdrant and Ragas evals"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client[fastembed]>=1.12",
    "langchain>=1.0",
    "langchain-openai>=1.1",
    "langchain-anthropic>=1.0",
    "ragas>=0.4.3,<0.5",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2
    "langchain-community==0.4.1",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
